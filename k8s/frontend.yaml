apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      nodeSelector:
        workload-role: application
      containers:
        - name: adaptive-workload-frontend
          image: adaptive-workload-frontend:fix1
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          env:
            # nginx resolves this at request time via the cluster DNS resolver and does
            # not apply search domains, so use the fully qualified Service name.
            - name: BACKEND_UPSTREAM
              value: backend.default.svc.cluster.local:3000
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
