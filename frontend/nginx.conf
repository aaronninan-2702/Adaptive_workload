# Rendered by the nginx image entrypoint (envsubst) into /etc/nginx/conf.d/default.conf.
#   NGINX_LOCAL_RESOLVERS - set automatically from /etc/resolv.conf (kube-dns in Kubernetes,
#                           127.0.0.11 in Docker Compose)
#   BACKEND_UPSTREAM      - host:port of the backend Service (default set in frontend/Dockerfile,
#                           overridden in k8s/frontend.yaml with the cluster FQDN)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve the backend at request time instead of at startup. A static
    # `proxy_pass http://backend:3000` makes nginx exit with
    # "host not found in upstream" (CrashLoopBackOff) whenever cluster DNS is not
    # ready yet, e.g. after a node restart. nginx does not use resolv.conf search
    # domains, so BACKEND_UPSTREAM must be resolvable exactly as written.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    set $backend_upstream http://${BACKEND_UPSTREAM};

    client_max_body_size 6m;

    # The backend already serves everything under /api (/api/jobs, /api/health, ...).
    # proxy_pass has NO URI part, so the request path is forwarded unchanged:
    #   browser /api/jobs -> backend /api/jobs
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}